name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy
          pip install -r requirements.txt

      - name: Run Ruff linter
        run: ruff check core/ integrations/ tests/ --output-format=github

      - name: Run Ruff formatter check
        run: ruff format --check core/ integrations/ tests/

      - name: Check for deprecated datetime.utcnow()
        run: |
          echo "Checking for deprecated datetime.utcnow() usage..."
          if grep -r "datetime\.utcnow()" core/ integrations/ tests/ --include="*.py"; then
            echo "ERROR: Found deprecated datetime.utcnow() usage!"
            echo "Use datetime.now(UTC) instead"
            exit 1
          fi
          echo "No deprecated datetime.utcnow() found"

  test:
    name: Tests
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: dawo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests with coverage
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/dawo_test
          REDIS_URL: redis://localhost:6379
        run: |
          pytest tests/ --cov=core --cov-report=term-missing --cov-report=xml

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          fail_ci_if_error: false
