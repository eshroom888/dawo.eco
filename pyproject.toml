[project]
name = "dawo-eco"
version = "0.1.0"
description = "DAWO.ECO - Content Pipeline & B2B Sales Automation"
requires-python = ">=3.11"

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["core", "integrations", "ui", "tests"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade (catches deprecated APIs)
    "DTZ",    # flake8-datetimez (catches datetime.utcnow deprecation)
    "RUF",    # Ruff-specific rules
    "SIM",    # flake8-simplify
    "TCH",    # flake8-type-checking (TYPE_CHECKING imports)
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "B008",   # function call in default argument (FastAPI Depends)
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "B011",   # assert False allowed in tests
]
"__init__.py" = [
    "F401",   # unused imports in __init__.py (re-exports)
]

[tool.ruff.lint.isort]
known-first-party = ["core", "integrations", "ui"]

[tool.ruff.lint.flake8-datetimez]
# DTZ003: datetime.utcnow() is deprecated
# DTZ005: datetime.now() without timezone
# DTZ007: datetime.strptime() without timezone

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_ignores = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
